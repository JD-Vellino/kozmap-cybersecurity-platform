<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="t d">
  <title id="t">KozMap architecture</title>
  <desc id="d">High-level public architecture showing observation sources, deterministic security state, and investigation experience.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111e"/><stop offset="1" stop-color="#02060c"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10233a"/><stop offset="1" stop-color="#0a1525"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .title{font:700 48px Inter,Arial,sans-serif;fill:#f2f7ff}
      .sub{font:400 20px Inter,Arial,sans-serif;fill:#91a9c4}
      .eyebrow{font:700 14px Inter,Arial,sans-serif;fill:#6e8cac;letter-spacing:2px}
      .h{font:700 24px Inter,Arial,sans-serif;fill:#e5f1ff}
      .b{font:400 18px Inter,Arial,sans-serif;fill:#adc0d6}
      .small{font:600 14px Inter,Arial,sans-serif;fill:#7895b3}
      .card{fill:#091522;stroke:#203b56;stroke-width:2}
      .core{fill:url(#core);stroke:#418ee5;stroke-width:2.4}
      .ai{fill:#091522;stroke:#55cfdd;stroke-width:2.4}
      .pill{fill:#0c1b2a;stroke:#294864;stroke-width:1.4}
      .line{fill:none;stroke:#3a6387;stroke-width:3}
    </style>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <text x="78" y="76" class="title">KozMap</text>
  <text x="78" y="112" class="sub">Deterministic security state · Evidence-bound AI investigation</text>

  <text x="85" y="190" class="eyebrow">01 · OBSERVATION</text>
  <rect x="78" y="215" rx="22" width="330" height="430" class="card"/>
  <text x="110" y="263" class="h">Telemetry &amp; sensors</text>
  <text x="110" y="300" class="b">Multiple sources contribute evidence.</text>
  <g transform="translate(110 342)">
    <rect width="110" height="44" rx="16" class="pill"/><text x="55" y="28" text-anchor="middle" class="b">Zeek</text>
    <rect x="132" width="110" height="44" rx="16" class="pill"/><text x="187" y="28" text-anchor="middle" class="b">Falco</text>
    <rect y="62" width="110" height="44" rx="16" class="pill"/><text x="55" y="90" text-anchor="middle" class="b">Suricata</text>
    <rect x="132" y="62" width="110" height="44" rx="16" class="pill"/><text x="187" y="90" text-anchor="middle" class="b">Sysmon</text>
    <rect y="124" width="110" height="44" rx="16" class="pill"/><text x="55" y="152" text-anchor="middle" class="b">osquery</text>
    <rect x="132" y="124" width="110" height="44" rx="16" class="pill"/><text x="187" y="152" text-anchor="middle" class="b">Wazuh</text>
  </g>
  <text x="110" y="555" class="b">Native evidence + provenance</text>
  <text x="110" y="588" class="small">NO SINGLE SENSOR DEFINES TRUTH</text>

  <path d="M408 430 H505" class="line"/><polygon points="505,430 489,421 489,439" fill="#3a6387"/>

  <text x="525" y="190" class="eyebrow">02 · DETERMINISTIC FLOOR</text>
  <rect x="515" y="215" rx="22" width="445" height="430" class="core"/>
  <text x="550" y="263" class="h">Evidence &amp; state engine</text>
  <text x="550" y="310" class="b">Canonical evidence + provenance</text>
  <text x="550" y="346" class="b">Coverage &amp; observability state</text>
  <text x="550" y="382" class="b">Time-aware causality &amp; correlation</text>
  <text x="550" y="418" class="b">Hypotheses · chains · incidents</text>
  <text x="550" y="454" class="b">Lifecycle &amp; tamper-evident audit</text>
  <line x1="550" y1="495" x2="925" y2="495" stroke="#294864"/>
  <text x="550" y="538" class="h">Authoritative security state</text>
  <text x="550" y="576" class="b">Reproducible · inspectable · independent of AI</text>
  <text x="550" y="612" class="small">AI CAN INTERPRET STATE — IT DOES NOT OWN IT</text>

  <path d="M960 430 H1055" class="line"/><polygon points="1055,430 1039,421 1039,439" fill="#3a6387"/>

  <text x="1075" y="190" class="eyebrow">03 · INVESTIGATION &amp; EXPERIENCE</text>
  <circle cx="1240" cy="375" r="105" fill="#08182a" stroke="#428fe8" stroke-width="2.6" filter="url(#glow)"/>
  <circle cx="1240" cy="375" r="135" fill="none" stroke="#204264" stroke-width="1.8"/>
  <circle cx="1240" cy="375" r="162" fill="none" stroke="#142e48" stroke-width="1.3"/>
  <text x="1240" y="365" text-anchor="middle" class="h">Live security map</text>
  <text x="1240" y="400" text-anchor="middle" class="b">assets · VMs · flows · sensors</text>

  <rect x="1075" y="540" rx="20" width="330" height="105" class="ai"/>
  <text x="1105" y="582" class="h">Evidence-bound AI</text>
  <text x="1105" y="618" class="b">Local triage + Astra investigation</text>

  <rect x="1435" y="294" rx="16" width="120" height="56" class="pill"/><text x="1495" y="329" text-anchor="middle" class="b">Incidents</text>
  <rect x="1435" y="384" rx="16" width="120" height="56" class="pill"/><text x="1495" y="419" text-anchor="middle" class="b">Timeline</text>
  <rect x="1435" y="474" rx="16" width="120" height="56" class="pill"/><text x="1495" y="509" text-anchor="middle" class="b">Audit</text>

  <text x="78" y="742" class="h">Public architecture overview</text>
  <text x="78" y="776" class="b">Production source, rules, prompts, schemas, deployment details, and operational internals remain private.</text>
</svg>